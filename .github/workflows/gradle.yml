name: Java CI with Gradle

on:
  push:
    branches: [ master, erekir, v8-beta ]
  pull_request:
    branches: [ master, erekir, v8-beta ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v1
      with:
        java-version: 17
    - name: Setup Android SDK Tools
      uses: android-actions/setup-android@v2.0.1
      env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
    - name: Add cmdline-tools to PATH
      run: echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
    - name: build-tools
      run: sdkmanager "build-tools;29.0.3"
    - name: Add Android SDK to PATH
      run: echo "${ANDROID_HOME}/build-tools/29.0.3" >> $GITHUB_PATH
    - name: Install Android 30 Platform
      run: sdkmanager "platforms;android-30"
    - name: Grant execute permissions
      run: |
        chmod +x gradlew
        chmod +x alpha-bleed
        chmod +x alpha-bleeding-linux.exe

    - name: Build with Gradle
      run: ./gradlew buildDex

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: betamindy in a box
        path: build/libs/[!raw-]*.jar
